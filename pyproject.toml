[project]
name = "promptbridge-mcp"
version = "0.2.0"
description = "Type coding requests in your own language; get a clear English task spec for AI coding agents (MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Endy" }]
keywords = ["mcp", "model-context-protocol", "claude", "prompt", "spec", "i18n", "thai", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Thai",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.2",
    "pydantic>=2",
    "jinja2>=3",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/Endistic/promptbridge"
Issues = "https://github.com/Endistic/promptbridge/issues"
Changelog = "https://github.com/Endistic/promptbridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
promptbridge = "promptbridge.server:main"
promptbridge-mcp = "promptbridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptbridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "skills/", "README.md", "README.th.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
