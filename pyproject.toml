[project]
name = "promptbridge"
version = "0.1.0"
description = "Turn native-language intent into structured English task specs for AI coding agents (MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "pydantic>=2",
    "jinja2>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
promptbridge = "promptbridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
