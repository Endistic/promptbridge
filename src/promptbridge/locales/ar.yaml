locale: ar
name: Arabic
native_name: العربية
style: "Use Modern Standard Arabic. Keep code, file paths and English technical terms unchanged, left-to-right."

questions:
  goal: في جملة واحدة، ما النتيجة التي تريد الوصول إليها؟
  constraints: هل هناك ما لا يجب تغييره، أو قيود يجب الالتزام بها؟
  files: هل تعرف الملفات أو المجلدات المعنية؟
  observed: ماذا يحدث الآن (السلوك الخاطئ)؟
  expected: ماذا يجب أن يحدث بدلًا من ذلك؟
  location: أين يحدث ذلك؟ في أي صفحة أو API أو أمر؟
  repro: كيف يمكن إعادة إنتاج المشكلة؟ (الخطوات)
  error_log: هل توجد رسالة خطأ؟ الصقها كما هي.
  acceptance: متى نعتبر المهمة منجزة؟ وكيف نتحقق من ذلك؟
  behavior: ماذا يجب أن يرى المستخدم أو الجهة المستدعية، وماذا يحصل عليه؟
  edge_cases: ماذا يجب أن يحدث في الحالات غير المعتادة (مدخلات فارغة، تعطّل الـ API، تجاوز الحدود)؟
  surface: أين يوضع؟ في أي شاشة أو endpoint أو مهمة؟
  out_of_scope: هل هناك ما لا يدخل ضمن هذه المهمة؟
  target: أي جزء من الكود تريد إعادة هيكلته؟
  desired_structure: كيف تريد أن تكون البنية بعد إعادة الهيكلة؟
  behavior_preserved: هل يجب أن يبقى السلوك الحالي كما هو تمامًا؟
  tests: ما نوع الاختبارات المطلوبة؟
  code_under_test: أي كود تريد اختباره؟
  cases: ما الحالات التي يجب تغطيتها؟
  framework: ما إطار الاختبار المستخدم؟
  mocking: ما الذي يجب محاكاته (mock)، وما الذي يجب أن يكون حقيقيًا؟
  scope: أي جزء تريدني أن أشرحه؟
  focus: هل هناك نقطة تريد فهمها بشكل خاص؟
  depth: ما مستوى التفصيل الذي تريده؟

confirm: "فهمت أن: {value}. هل هذا صحيح؟"
