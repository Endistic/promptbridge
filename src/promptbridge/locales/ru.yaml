locale: ru
name: Russian
native_name: Русский
style: "Use the polite «вы» form."

questions:
  goal: Одним предложением — какой результат вы хотите получить?
  constraints: Есть ли что-то, что нельзя менять, или ограничения, которые нужно соблюдать?
  files: Знаете, какие файлы или папки затронуты?
  observed: Что происходит сейчас (неправильное поведение)?
  expected: Как должно быть на самом деле?
  location: Где это происходит — на какой странице, в каком API или команде?
  repro: Как воспроизвести проблему? (шаги)
  error_log: Есть сообщение об ошибке? Вставьте его как есть.
  acceptance: Когда задача считается выполненной? Как это проверить?
  behavior: Что должен видеть и получать пользователь или вызывающий код?
  edge_cases: Что делать в нестандартных случаях (пустой ввод, сбой API, превышение лимитов)?
  surface: Где это будет — на каком экране, в каком эндпоинте или задаче?
  out_of_scope: Есть ли что-то, что не входит в эту задачу?
  target: Какой код нужно отрефакторить?
  desired_structure: Какой должна стать структура после рефакторинга?
  behavior_preserved: Текущее поведение должно остаться полностью прежним?
  tests: Какие тесты нужны?
  code_under_test: Какой код нужно протестировать?
  cases: Какие случаи нужно покрыть?
  framework: Какой тестовый фреймворк используется?
  mocking: Что нужно замокать, а что должно быть настоящим?
  scope: Какую часть объяснить?
  focus: Что вам особенно хочется понять?
  depth: Насколько подробно?

confirm: "Я понял так: {value}. Верно?"
